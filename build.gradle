plugins {
    id 'java'
    id 'com.google.protobuf' version '0.9.5'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

def grpcVersion = '1.70.0'
def protobufVersion = '3.25.8'
def protocVersion = protobufVersion

dependencies {
    implementation "io.grpc:grpc-netty:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"

    // Java 9+ annotation workaround
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    testImplementation 'junit:junit:4.13.2'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins { grpc {} }
    }
}

tasks.register('runServer', JavaExec) {
    group = 'application'
    description = 'Runs the gRPC server'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'HelloWorldServer'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Runs the gRPC client'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'HelloWorldClient'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    args = ['Thomas', 'Micheler']
}
